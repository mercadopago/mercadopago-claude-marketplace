name: Generate Catalog

on:
  push:
    branches: [main, feature/views]
    paths:
      - 'plugins/mercadopago/skills/*/SKILL.md'
      - 'plugins/mercadopago/agents/*.md'
      - 'plugins/mercadopago/commands/*.md'
      - 'plugins/mercadopago/hooks/**'
      - 'plugins/mercadopago/.claude-plugin/plugin.json'
      - 'scripts/generate_catalog.py'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Generate components.json
        run: python3 scripts/generate_catalog.py

      - name: Validate JSON
        run: python3 -m json.tool docs/components.json > /dev/null

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/components.json
          git diff --cached --quiet || git commit -m "chore: auto-regenerate components.json"
          git push
